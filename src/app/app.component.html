
<header class="app-header">
  <a class="app-brand" routerLink="/home" aria-label="Northstar home">
    <span class="brand-mark">N</span>
    <span>northstar<span class="brand-period">.</span></span>
  </a>
  <nav class="app-nav" aria-label="Main navigation">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">New Inquiry</a>
    @if (loggedUserName && !isLoginPage) {
      <a routerLink="/enquiry-list" routerLinkActive="active">Inquiry List</a>
      <a routerLink="/category" routerLinkActive="active">Categories</a>
      <a routerLink="/status" routerLinkActive="active">Status Master</a>
    } @else if (!isLoginPage) {
      <a routerLink="/login" routerLinkActive="active">Admin Login</a>
    }
  </nav>
</header>
<router-outlet></router-outlet>
